<meta charset="utf-8"><title>Ronathan — Chat</title>
<link rel="stylesheet" href="/style.css"><script src="/nav.js"></script>
<script>nav('/ronathan')</script>
<main>
  <h1>Ronathan</h1>
  <p class="muted">Ask about the portfolio, pending theses, markets — or say
  "run the pipeline on NVDA". Ronathan can research and explain; it can never
  approve — that stays on <a href="/">Mission Control</a>.</p>
  <div class="chat">
    <div class="chatlog" id="log"></div>
    <div class="row">
      <input id="text" style="flex:1" placeholder="Talk to Ronathan…"
        onkeydown="if(event.key==='Enter')send()">
      <button id="sendbtn" onclick="send()">Send</button>
    </div>
  </div>
</main>
<script>
const log = document.getElementById('log');
function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
async function send() {
  const input = document.getElementById('text');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  bubble('user', text);
  const btn = document.getElementById('sendbtn');
  btn.disabled = true;
  let current = null;
  try {
    // /api/ask starts paid LLM work, so it needs the paired key like every
    // other POST (api() can't be used: this response is a stream)
    const r = await fetch('/api/ask', {method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Dash-Key': dashKey()},
      body: JSON.stringify({text, thread: 'dashboard'})});
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || r.status);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let ev;
        try { ev = JSON.parse(line); } catch { continue; }
        if (ev.kind === 'tool')
          bubble('toolcall', `⚙ ${ev.name}(${JSON.stringify(ev.args || {})})`);
        else if (ev.kind === 'text') {
          if (!current) current = bubble('ronathan', '');
          current.textContent = ev.text;
          log.scrollTop = log.scrollHeight;
        } else if (ev.kind === 'error')
          bubble('toolcall', `✖ ${ev.text}`);
      }
    }
  } catch (e) { bubble('toolcall', '✖ ' + e.message); }
  btn.disabled = false;
  input.focus();
}
bubble('ronathan', "Hi, I'm Ronathan. Ask me about the desk, or name a ticker " +
  'and I\'ll put it through the pipeline.');
</script>
